[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "revisionlab"
version = "0.1.0"
description = "PyTorch-native delayed-feedback memory contracts, controls, and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "cjw0076"}]
dependencies = ["torch>=2.2", "numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/cjw0076/revisionlab"
Issues = "https://github.com/cjw0076/revisionlab/issues"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "build>=1.2", "twine>=5", "hatch>=1.13"]

[project.scripts]
revisionlab-check = "revisionlab.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revisionlab"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/LICENSE", "/STATE.md", "/pyproject.toml", "/.github/workflows/ci.yml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src/revisionlab"]
strict = true

[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
