name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Types
        run: python -m mypy src/revisionlab
      - name: Contracts, diagnostics, compile, and serialization
        run: python -m pytest
      - name: Core remains independent of Transformers
        run: python -c "import importlib.util; import revisionlab; assert importlib.util.find_spec('transformers') is None"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel outside source checkout
        shell: bash
        run: |
          python -m pip uninstall -y revisionlab
          python -m pip install --no-deps dist/*.whl
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          python -c "from pathlib import Path; import revisionlab; path=Path(revisionlab.__file__).resolve(); assert 'site-packages' in path.parts and 'src' not in path.parts, path; print(path)"
          revisionlab-check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python }}
          path: dist/*

  transformers:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.57.6", "5.18.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and optional integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,transformers]" "transformers==${{ matrix.transformers }}"
      - name: Require Transformers and check types
        run: |
          python -c "from transformers import BertConfig, BertForSequenceClassification; from revisionlab.integrations.transformers import issue_regression"
          python -m mypy src/revisionlab examples/transformers_delayed_regression.py
      - name: Offline integration contracts
        run: python -m pytest tests/test_transformers.py tests/test_transformers_optional.py
      - name: Runnable offline example
        run: python examples/transformers_delayed_regression.py
