name: Publish reviewed v0.1.0

on:
  workflow_dispatch:
    inputs:
      target:
        description: Validate only, publish TestPyPI, or promote verified TestPyPI to PyPI
        required: true
        default: validate
        type: choice
        options: [validate, testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: revisionlab-v0.1.0-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'cjw0076/revisionlab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download the released distributions without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/cjw0076/revisionlab/git/ref/tags/v0.1.0 --jq .object.sha)" = 58567cc162f2d290be10c8e26ca251bbf6d3ccbc
          test "$(gh release view v0.1.0 --repo cjw0076/revisionlab --json targetCommitish --jq .targetCommitish)" = 58567cc162f2d290be10c8e26ca251bbf6d3ccbc
          test "$(gh api repos/cjw0076/revisionlab/actions/runs/36822956187 --jq .head_sha)" = 58567cc162f2d290be10c8e26ca251bbf6d3ccbc
          test "$(gh api repos/cjw0076/revisionlab/actions/runs/36822956187 --jq .conclusion)" = success
          gh release download v0.1.0 --repo cjw0076/revisionlab --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          python scripts/verify_release.py assets dist
      - name: Metadata and installed wheel verification
        run: |
          python -m pip install twine pytest
          python -m twine check --strict dist/*
          python -m pytest tests/test_release_verifier.py
          python scripts/verify_release.py install --directory dist
      - name: Verify TestPyPI artifacts and fresh index installation before promotion
        if: inputs.target == 'pypi'
        run: python scripts/verify_release.py install --index testpypi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-v0.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  testpypi:
    needs: validate
    if: inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/revisionlab/0.1.0/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-v0.1.0
          path: dist
      - name: Recheck original hashes in the isolated publisher
        working-directory: dist
        run: |
          sha256sum --check - <<'HASHES'
          fd9500032333fd2cdb1a990e39f9c1d4c5e8b7556036eb79f167277dc73704e8  revisionlab-0.1.0-py3-none-any.whl
          e8529a4c07ae9cb3672fe96168bb7ab71bdd205ddb428289285b1e54690d121f  revisionlab-0.1.0.tar.gz
          HASHES
      - name: Publish the verified original assets with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false
          attestations: true

  pypi:
    needs: validate
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/revisionlab/0.1.0/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-v0.1.0
          path: dist
      - name: Recheck original hashes in the isolated publisher
        working-directory: dist
        run: |
          sha256sum --check - <<'HASHES'
          fd9500032333fd2cdb1a990e39f9c1d4c5e8b7556036eb79f167277dc73704e8  revisionlab-0.1.0-py3-none-any.whl
          e8529a4c07ae9cb3672fe96168bb7ab71bdd205ddb428289285b1e54690d121f  revisionlab-0.1.0.tar.gz
          HASHES
      - name: Publish the same verified assets with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: false
          attestations: true

  verify-index:
    needs: [validate, testpypi, pypi]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.testpypi.result == 'success' || needs.pypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TARGET_INDEX: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify uploaded bytes and clean installation from the target index
        run: python scripts/verify_release.py install --index "$TARGET_INDEX"
